<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>구독 사용량</title>
<style>
:root{--ink:#dce5ee;--muted:#8996a7;--paper:#15191f;--panel:#1d232b;--line:#343c46;--blue:#588fe4;--schedule:#626d7c;--orange:#eaa057;--empty:#303946}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:720px;margin:0 auto;padding:26px 16px 32px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:19px;letter-spacing:-.04em;margin:0;font-weight:650}.confirmed{color:var(--muted);font-size:10px;text-align:right;line-height:1.6;white-space:nowrap}.confirmed span{display:block;font-size:9px;color:#727f90}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.provider{display:grid;grid-template-columns:78px minmax(0,1fr);gap:9px;padding:17px 13px;border-bottom:1px solid var(--line)}.provider:last-child{border:0}.brand h2{font-size:13px;font-weight:650;margin:1px 0 4px}.brand p{color:var(--muted);font-size:9px;margin:0}.windows{min-width:0}.money{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:3px 0;font-size:10px;color:var(--muted)}.money strong{font-size:14px;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.money strong.unavailable{font-size:10px;color:var(--muted);font-weight:400}.money-note{font-size:9px;color:var(--muted);line-height:1.7;margin:8px 0 0}.key-cap{margin:9px 0 7px}.key-cap .bar{margin-top:5px}.window{display:grid;grid-template-columns:32px 36px minmax(32px,1fr) 66px;gap:7px;align-items:center;min-height:31px}.window+.window{margin-top:12px}.period{font-size:10px;color:var(--muted)}.amount{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}.bar{display:flex;width:100%;height:9px;overflow:hidden;border-radius:3px;background:var(--empty)}.segment{height:100%;flex:none}.blue{background:var(--blue)}.schedule{background:var(--schedule)}.ahead{background:var(--orange)}.reset{font-size:9px;color:var(--muted);line-height:1.6;text-align:right;font-variant-numeric:tabular-nums}.reset strong{display:block;color:#b8c6d8;font-size:10px;font-weight:500}.ticket{font-size:10px;color:var(--muted);margin-top:9px;line-height:1.6}.ticket strong{display:block;color:#acbdd4;font-weight:500}.ticket .expiry{font-size:9px;padding:4px 0 0}.loading{padding:16px}.missing{margin:2px 0 0;color:var(--muted);font-size:11px}.warning{color:var(--orange);font-size:10px;margin:8px 0 0}.legend{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--muted);font-size:10px;margin-top:16px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:7px;border-radius:2px;display:inline-block}.explanation{font-size:10px;color:var(--muted);margin:8px 0 0;line-height:1.7}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;color:#727f90;font-size:9px}button{color:#aab9cc;border:1px solid var(--line);border-radius:6px;background:transparent;font:inherit;font-size:10px;padding:6px 9px;cursor:pointer}button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}#connection{color:var(--orange);font-size:10px;margin-top:10px;min-height:0}@media(min-width:520px){main{padding:36px 24px}.provider{grid-template-columns:88px minmax(0,1fr);padding:19px 18px}.window{grid-template-columns:48px 42px minmax(70px,1fr) 94px;gap:12px}.brand h2{font-size:15px}.period{font-size:11px}.reset{font-size:10px}.reset strong{font-size:11px}}@media(max-width:350px){main{padding-left:10px;padding-right:10px}.provider{grid-template-columns:72px minmax(0,1fr);padding:15px 10px;gap:7px}.window{grid-template-columns:28px 32px minmax(24px,1fr) 60px;gap:5px}.amount{font-size:14px}}

.activity-link{color:var(--muted);font-size:10px}.chart-caption{font-size:9px;color:var(--muted);margin:16px 0 7px}.activity-chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin-bottom:15px}.activity-day{min-width:0}.activity-stack{height:126px;display:flex;flex-direction:column-reverse;justify-content:flex-start;overflow:hidden;border-radius:3px 3px 0 0;border-bottom:1px solid var(--line)}.activity-segment{display:block;flex:none;width:100%}.activity-date{display:block;text-align:center;color:var(--muted);font:9px/2 ui-monospace,SFMono-Regular,monospace}.activity-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10px;font-variant-numeric:tabular-nums}.activity-table th,.activity-table td{padding:5px 0 5px 6px;text-align:right;white-space:nowrap}.activity-table thead th{color:var(--muted);font-size:9px;font-weight:500}.activity-table th:first-child{width:47%;padding-left:0;text-align:left;font-weight:400}.activity-table thead th:first-child{color:transparent}.model-label{display:flex;align-items:center;gap:6px}.model-label>span{overflow:hidden;text-overflow:ellipsis}.model-dot{width:7px;height:7px;flex:none;border-radius:50%}.activity-table td{color:#b8c6d8}@media(max-width:400px){.provider:has(.activity-chart),.provider:has(.activity-link){grid-template-columns:1fr}.provider:has(.activity-chart) .brand,.provider:has(.activity-link) .brand{display:flex;align-items:baseline;gap:8px}.activity-table{font-size:11px}.activity-table thead th{font-size:10px}}@media(min-width:520px){.activity-stack{height:150px}.activity-table{font-size:11px}.money{font-size:11px}}
.quota-track{position:relative;width:100%}.elapsed-tick{position:absolute;top:-10px;width:10px;height:8px;background:rgba(178,189,204,.65);clip-path:polygon(0 0,100% 0,50% 100%);transform:translateX(-50%);border:0;box-shadow:none;z-index:1}
</style></head><body><main><header><h1>구독 사용량</h1><div class="confirmed" id="confirmed">마지막 확인 · 조회 중<span>표시된 값 중 가장 오래된 기준</span></div></header><section class="panel" id="providers" aria-label="앱별 사용량"><p class="missing loading">최근 확인값을 불러오고 있습니다.</p></section><div class="legend" aria-label="막대 범례"><span><i class="blue"></i>사용량</span><span><i class="ahead"></i>오버페이스</span></div><p class="explanation">삼각형은 기간 경과 위치입니다. 오버페이스는 기간 대비 빠르게 쓴 양이며, 추가 요금이나 한도 초과를 뜻하지 않습니다.<br>기간을 확인할 수 없는 한도는 시간 비교를 표시하지 않습니다.</p><div id="connection" role="status" aria-live="polite"></div><div class="footer"><span>5분마다 조회 · 오래된 값은 Stale로 표시</span><button id="retry" type="button">새로고침</button></div></main>
<script>
const area=document.getElementById('providers'),connection=document.getElementById('connection'),confirmed=document.getElementById('confirmed');let cached=null;
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function koreaParts(value){const date=new Date(value);if(!value||!Number.isFinite(date.getTime()))return null;return Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).formatToParts(date).filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]))}
function absolute(value,full=false){const p=koreaParts(value);if(!p)return '시각 없음';if(!full)return `${p.month}/${p.day} ${String(p.hour).padStart(2,'0')}:${String(p.minute).padStart(2,'0')}`;return `${String(p.year).slice(-2)}년 ${p.month}월 ${p.day}일 ${p.hour}시${p.minute?p.minute+'분':''}${p.second?p.second+'초':''}`}
function expiryRemaining(value,now=Date.now()){const ms=new Date(value).getTime()-now;if(!Number.isFinite(ms))return '확인 불가';if(ms<=0)return '만료';const mins=Math.floor(ms/60000);if(mins>=1440)return `${Math.floor(mins/1440)}일 남음`;if(mins>=60)return `${Math.floor(mins/60)}시간 남음`;if(mins>=1)return `${mins}분 남음`;return '1분 미만 남음'}
function relativeStamp(value){if(!value)return '아직 확인되지 않음';const ms=new Date(value).getTime();if(!Number.isFinite(ms))return '시각 없음';const age=Math.max(0,Math.floor((Date.now()-ms)/1000));if(age<60)return '방금';if(age<3600)return `${Math.floor(age/60)}분 전`;if(age<86400)return `${Math.floor(age/3600)}시간 전`;return `${Math.floor(age/86400)}일 전`}
function countdown(value){const n=new Date(value).getTime()-Date.now();if(n<=0)return '리셋 확인 대기';const mins=Math.ceil(n/60000),days=Math.floor(mins/1440),hours=Math.floor(mins%1440/60);return days?`${days}일 ${hours}시간 후`:`${hours}시간 ${mins%60}분 후`}
function barSegments(used,elapsed){const u=Math.max(0,Math.min(100,used));if(elapsed===null)return {blue:u,schedule:0,ahead:0,empty:100-u};const t=Math.max(0,Math.min(100,elapsed));return {blue:Math.min(u,t),schedule:Math.max(0,t-u),ahead:Math.max(0,u-t),empty:100-Math.max(u,t)}}
function elapsedPercent(w,now=Date.now()){const end=new Date(w.resetAt).getTime(),minutes=w.windowMinutes;if(!Number.isFinite(end)||!Number.isInteger(minutes)||minutes<=0||now>=end)return null;const start=end-minutes*60000;return Math.max(0,Math.min(100,(now-start)/(minutes*60000)*100))}
function makeWindow(w){
  const row=el('div',undefined,'window');
  row.append(el('span',w.label,'period'),el('strong',`${w.usedPercent}%`,'amount'));
  const elapsed=elapsedPercent(w),segments=barSegments(w.usedPercent,elapsed);
  const track=el('div',undefined,'quota-track'),bar=el('div',undefined,'bar');
  for(const [key,cls] of [['blue','blue'],['ahead','ahead']]){
    const piece=el('span',undefined,'segment '+cls);
    piece.style.width=`${segments[key]}%`;bar.append(piece);
  }
  track.append(bar);
  if(elapsed!==null){
    const tick=el('span',undefined,'elapsed-tick');
    tick.style.left=`${elapsed}%`;
    tick.title=`기간 경과 ${elapsed.toFixed(1)}%`;
    tick.setAttribute('aria-hidden','true');track.append(tick);
  }
  const label=elapsed===null?`${w.label} 사용 ${w.usedPercent}%. 시간 비교 미지원.`:
    `${w.label} 사용 ${w.usedPercent}%, 삼각형은 기간 경과 ${elapsed.toFixed(1)}% 위치. 주황 오버페이스 ${segments.ahead.toFixed(1)}%. 오버페이스는 요금 또는 한도 초과가 아닙니다.`;
  track.setAttribute('role','img');track.setAttribute('aria-label',label);track.title=label;row.append(track);
  const reset=el('div',undefined,'reset');
  reset.append(el('strong',countdown(w.resetAt)),el('span',absolute(w.resetAt)));
  reset.title='리셋 '+absolute(w.resetAt,true);row.append(reset);
  return {row,unsupported:elapsed===null};
}

function moneyValue(value){return typeof value==='number'&&Number.isFinite(value)&&value>=0?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(value):null}
function moneyRow(label,value){const row=el('div',undefined,'money'),formatted=moneyValue(value);row.append(el('span',label),el('strong',formatted===null?'조회 불가':formatted,formatted===null?'unavailable':undefined));return row}
function modelColor(model,index){const name=model.name.toLowerCase();if(name==='others')return '#888888';if(/space[-_ ]bunny/.test(name))return '#37d9cc';if(name.includes('mimo'))return '#4885b5';if(/glm.?5[.-]2/.test(name))return '#ffbb28';if(name.includes('kimi'))return '#ff6048';return ['#ab83d5','#87b94c','#df7cad','#76b8eb','#c9a269'][index%5]}
function compact(value){return new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(value)}
function makeOpenRouter(p,box){
  const m=p.metrics,a=p.activity;
  box.append(moneyRow('계정 크레딧',m?.balanceUSD),moneyRow('최근 7일 사용액',a?.status==='available'?a.spendUSD:null));
  if(!a||a.status!=='available'){
    box.append(el('p','최근 7일 상세 사용량 · 조회 불가','money-note'));
    const link=el('a','OpenRouter에서 확인','activity-link');link.href='https://openrouter.ai/workspaces/default';link.target='_blank';link.rel='noopener noreferrer';box.append(link);return;
  }
  const caption=el('p','일별 토큰 · '+a.dates[0].slice(5).replace('-','/')+'–'+a.dates[6].slice(5).replace('-','/')+' · UTC','chart-caption');box.append(caption);
  const chart=el('div',undefined,'activity-chart');chart.setAttribute('role','img');chart.setAttribute('aria-label','최근 7일 날짜별 토큰 사용량. 모델별 누적 막대.');
  const maximum=Math.max(1,...a.days.map(day=>day.tokens.reduce((sum,n)=>sum+n,0)));
  for(const day of a.days){
    const column=el('div',undefined,'activity-day'),bar=el('div',undefined,'activity-stack');
    let detail=day.date+' · '+compact(day.tokens.reduce((sum,n)=>sum+n,0))+' tokens';
    day.tokens.forEach((tokens,index)=>{const segment=el('span',undefined,'activity-segment');segment.style.height=(tokens/maximum*100)+'%';segment.style.background=modelColor(a.models[index],index);segment.title=a.models[index].name+' · '+compact(tokens)+' tokens';bar.append(segment);detail+='\n'+a.models[index].name+': '+compact(tokens)});
    bar.title=detail;column.append(bar,el('span',day.date.slice(5).replace('-','/'),'activity-date'));chart.append(column);
  }
  box.append(chart);
  const table=el('table',undefined,'activity-table'),head=el('thead'),tr=el('tr');
  for(const title of ['모델','Tokens','Requests','Spend']){const th=el('th',title);th.scope='col';tr.append(th)}head.append(tr);table.append(head);
  const body=el('tbody');
  a.models.forEach((model,index)=>{const row=el('tr'),name=el('th');name.scope='row';const label=el('span',undefined,'model-label'),dot=el('i',undefined,'model-dot');dot.style.background=modelColor(a.models[index],index);dot.setAttribute('aria-hidden','true');label.append(dot,el('span',model.name.includes('/')?model.name.split('/').slice(1).join('/'):model.name));name.append(label);name.title=model.name;row.append(name,el('td',compact(model.tokens)),el('td',compact(model.requests)),el('td',moneyValue(model.spendUSD)));body.append(row)});
  table.append(body);box.append(table);
  if(!a.models.length)box.append(el('p','최근 7일 사용 내역 없음','money-note'));
  if(a.stale)box.append(el('p','상세 사용량 갱신 대기 · '+relativeStamp(a.observedAt)+' 확인값','warning'));
}

function render(data,offline=false){area.replaceChildren();const dates=data.providers.filter(p=>p.observedAt).map(p=>new Date(p.observedAt).getTime()).filter(Number.isFinite);const oldest=dates.length?new Date(Math.min(...dates)).toISOString():null;confirmed.replaceChildren(document.createTextNode('마지막 확인 · '+relativeStamp(oldest)),el('span','표시된 값 중 가장 오래된 기준'));for(const p of data.providers){const row=el('article',undefined,'provider'),brand=el('div',undefined,'brand');brand.append(el('h2',p.name));const old=!!p.observedAt&&(Date.now()-new Date(p.observedAt).getTime())/1000>data.staleAfterSeconds,stale=p.stale||old||offline;brand.append(el('p',p.status==='not_connected'?'미연결':!p.observedAt?'조회 대기':stale?'Stale':'연결됨'));row.append(brand);const windows=el('div',undefined,'windows');let unsupported=false;for(const w of p.windows){const result=makeWindow(w);windows.append(result.row);unsupported=unsupported||result.unsupported}if(p.id==='openrouter')makeOpenRouter(p,windows);else if(!p.windows.length)windows.append(el('p',p.status==='not_connected'?'아직 연결되지 않았습니다.':'실제 사용량을 확인하고 있습니다.','missing'));if(unsupported)windows.append(el('p','시간 비교 미지원 · 기간 미확인 또는 리셋 경과','warning'));if(p.observedAt&&stale)windows.append(el('p','Stale · '+relativeStamp(p.observedAt)+' 확인값 유지 · 갱신 대기','warning'));if(p.id==='claude'){const ticket=el('div',undefined,'ticket');ticket.append(el('strong','리셋권 조회 미지원'));windows.append(ticket)}if(p.id==='codex'){const t=p.resetTickets,box=el('div',undefined,'ticket');box.append(el('strong',t&&t.availableCount!==null?`리셋권 ${t.availableCount}장`:'리셋권 조회 불가'));if(t&&t.availableCount!==null){for(const e of t.expirations)box.append(el('div',e.expirationKnown?(e.expiresAt?absolute(e.expiresAt,true)+' 만료 · '+expiryRemaining(e.expiresAt):'만료 없음'):'만료일 확인 불가','expiry'));if(t.availableCount>0&&!t.detailsComplete)box.append(el('div','일부 만료일은 아직 확인되지 않았습니다.','expiry'))}windows.append(box)}row.append(windows);area.append(row)}}
async function refresh(){try{const r=await fetch('/api/usage',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(data.schemaVersion!==1||!Array.isArray(data.providers))throw Error();cached=data;render(data);connection.textContent=''}catch{connection.textContent='연결을 확인해 주세요. 마지막 확인값을 유지합니다.';if(cached)render(cached,true)}}
document.getElementById('retry').addEventListener('click',refresh);refresh();setInterval(refresh,30000);setInterval(()=>{if(cached)render(cached,!!connection.textContent)},1000);
</script></body></html>
